[project]
name = "graham"
version = "0.1.0"
description = "Agente de investimentos pessoal com servidor MCP, aprovação humana no LangGraph e streaming pelo AG-UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=1,<2",
    "bcrypt>=4.2",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain[openai]>=1.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.3,<3",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.6",
    "pyyaml>=6",
    "redis>=8.1.0",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os imports `src.*` partem da raiz, como no servidor e no REPL.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Os evals chamam o modelo de verdade e custam tokens: só com `-m eval`.
addopts = "-m 'not eval'"
markers = [
    "integration: precisa do Postgres e do Redis (TEST_DATABASE_URL e TEST_REDIS_URL)",
    "eval: chama o modelo configurado no .env; não determinístico, roda só com -m eval",
]

[tool.ruff.lint]
# O conjunto clássico (erros de sintaxe, nomes indefinidos, imports sem uso),
# fixo: a 0.17 ampliou o padrão com regras de estilo que o código ainda não segue.
select = ["E4", "E7", "E9", "F"]
