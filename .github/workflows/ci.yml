name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: graham
          POSTGRES_PASSWORD: graham
          POSTGRES_DB: graham
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graham -d graham"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # O banco é recriado pelos testes; o Redis usa o banco 1.
      TEST_DATABASE_URL: postgresql://graham:graham@127.0.0.1:5432/graham_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      # Unidade, grafo e integração. Os evals chamam o modelo de verdade e ficam de fora.
      - run: uv run pytest -ra
