<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graham Agent — Seu corretor de confiança</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body data-auth="pending">

  <!-- Cabeçalho flutuante: sobrepõe a conversa, que corre por baixo. -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-start">
        <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button"
                aria-label="Conversas" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h10"/>
          </svg>
        </button>
        <button id="new-chat" class="ghost-button" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nova conversa
        </button>
      </div>
      <div class="topbar-end">
        <span id="topbar-mark" class="topbar-mark" hidden>Graham Agent</span>
        <button id="sign-out" class="ghost-button" type="button">Sair</button>
      </div>
    </div>
  </header>

  <!-- Conversas: fixa à esquerda em telas largas, gaveta nas estreitas. -->
  <aside id="sidebar" class="sidebar" aria-label="Conversas">
    <h2 class="sidebar-title">Conversas</h2>
    <div class="sidebar-search">
      <input id="thread-search" type="search" placeholder="Buscar conversas"
             aria-label="Buscar conversas" autocomplete="off" maxlength="100">
    </div>
    <nav class="sidebar-scroll">
      <ul id="thread-list" class="thread-list"></ul>
      <p id="thread-list-empty" class="thread-list-empty" hidden></p>
    </nav>
  </aside>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Entrada: sem sessão, é tudo o que aparece. -->
  <section id="auth" class="auth" aria-label="Entrar">
    <h1 class="hero-name">Graham Agent</h1>
    <p class="hero-tagline">Seu corretor de confiança</p>

    <form id="auth-form" class="auth-form" novalidate>
      <label class="auth-field">
        <span>E-mail</span>
        <input id="auth-email" type="email" autocomplete="username" required>
      </label>
      <label class="auth-field">
        <span>Senha</span>
        <input id="auth-password" type="password" autocomplete="current-password" required>
      </label>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button id="auth-submit" class="auth-submit" type="submit">Entrar</button>
      <p class="auth-switch">
        <span id="auth-switch-text">Não tem conta?</span>
        <button id="auth-switch" class="auth-link" type="button">Criar conta</button>
      </p>
    </form>
  </section>

  <div id="app" class="app is-empty">

    <main id="thread" class="thread">
      <section id="hero" class="hero">
        <h1 class="hero-name">Graham Agent</h1>
        <p class="hero-tagline">Seu corretor de confiança</p>

        <ul class="suggestions">
          <li><button class="suggestion" type="button">Quanto vale BBAS3 hoje?</button></li>
          <li><button class="suggestion" type="button">Notícias da Petrobras</button></li>
          <li><button class="suggestion" type="button">Maiores bancos do Brasil</button></li>
        </ul>
      </section>
    </main>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="input" rows="1" autocomplete="off"
                  placeholder="Pergunte sobre uma ação, uma empresa, um setor…"></textarea>
        <button id="send" class="send" type="submit" aria-label="Enviar pergunta">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </form>

      <p class="colophon">
        Cotações com atraso via Yahoo Finance &middot; Material de estudo, não recomendação de investimento
      </p>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
