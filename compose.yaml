# Serviços locais do Graham: Postgres 18 com pgvector, Redis e, no perfil `app`, o próprio Graham.
#
#   docker compose up -d      sobe o Postgres e o Redis em segundo plano
#   docker compose --profile app up -d --build
#                             sobe também o Graham, em http://127.0.0.1:8000
#   docker compose ps         mostra se está de pé (e saudável)
#   docker compose logs db    mostra o que o Postgres escreveu no log
#   docker compose down       desliga tudo; os dados do Postgres continuam no volume
#   docker compose down -v    desliga e APAGA os dados

services:
  db:
    # Imagem oficial do Postgres com o pgvector já compilado.
    image: pgvector/pgvector:pg18
    environment:
      # Credenciais só de desenvolvimento: a porta abaixo só aceita conexões
      # desta máquina.
      POSTGRES_USER: graham
      POSTGRES_PASSWORD: graham
      POSTGRES_DB: graham
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A partir do Postgres 18, a imagem guarda os dados em um subdiretório por
      # versão e espera o volume montado em /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graham -d graham"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Só cache e streams com TTL de 1h: nada aqui precisa sobreviver a um
    # reinício, então a persistência em disco fica desligada.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Fora do `docker compose up` comum: quem desenvolve roda o uvicorn com --reload
    # na mesma porta.
    profiles: ["app"]
    build: .
    # A chave do modelo e os traces opcionais vêm do .env; os endereços abaixo valem mais.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://graham:graham@db:5432/graham?connect_timeout=10
      REDIS_URL: redis://redis:6379/0
      PUBLIC_URL: http://127.0.0.1:8000
      MCP_INTERNAL_URL: http://127.0.0.1:8000/mcp
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
